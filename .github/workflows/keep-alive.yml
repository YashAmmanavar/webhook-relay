name: Keep Render service awake

# Render's free tier spins down the service after 15 minutes with no
# incoming traffic; the next request then pays a 30-60s cold-start penalty.
# Pinging the (unauthenticated) health check every 10 minutes keeps it warm.
# 10 minutes leaves margin below the 15-minute threshold even accounting for
# GitHub Actions' scheduled runs sometimes firing a few minutes late.
#
# Note: GitHub automatically disables scheduled workflows after 60 days with
# no commits to the repo — re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: curl -sf https://webhook-relay-h0dk.onrender.com/api/v1/health
